title: "📢 [공지] "
labels:
  - "문서"

body:
  - type: markdown
    attributes:
      value: |
        <!--
        채록 프로젝트 공지 템플릿입니다.

        제목 예시:
        📢 [공지] 백엔드 브랜치 전략 확정
        📢 [공지] Supabase 설정 기준 공유
        📢 [공지] API 응답 형식 통일 안내
        📢 [공지] 방문 인증 기준 변경 안내
        -->

  - type: textarea
    id: summary
    attributes:
      label: "📌 공지 요약"
      description: "공지 내용을 한두 문장으로 요약해주세요."
      placeholder: |
        - 백엔드 1·2는 develop 브랜치를 기준으로 feature 브랜치에서 작업합니다.
        - Supabase DB 연결 설정은 환경변수 기반으로 통일합니다.
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: "📝 공지 내용"
      description: "팀원이 확인해야 할 내용을 작성해주세요."
      placeholder: |
        - 결정된 내용
        - 변경된 기준
        - 주의할 점
    validations:
      required: true

  - type: dropdown
    id: target_area
    attributes:
      label: "📂 관련 영역"
      description: "공지와 관련된 영역을 선택해주세요."
      options:
        - 공통
        - Backend 1: 사용자·관광 데이터·코스/Odii
        - Backend 2: 방문 인증·필름 롤·미디어 생성
        - DB / Supabase
        - Frontend
        - 기획 / 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: action_items
    attributes:
      label: "✅ 확인 / 작업 필요 사항"
      description: "팀원이 확인하거나 진행해야 할 작업이 있다면 작성해주세요."
      placeholder: |
        - [ ] develop 브랜치 기준으로 작업 브랜치 생성
        - [ ] application.yml 설정 확인
        - [ ] Swagger 접속 확인
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: "🔗 참고 자료"
      description: "관련 이슈, PR, 회의록, 문서 링크가 있다면 작성해주세요."
      placeholder: |
        - 관련 이슈:
        - 관련 PR:
        - 회의록:
    validations:
      required: false