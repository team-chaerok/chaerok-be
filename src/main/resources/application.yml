server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  application:
    name: chaerok-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"

supabase:
  url: ${SUPABASE_URL}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

external:
  kakao:
    api-key: ${KAKAO_REST_API_KEY}
  tour-api:
    key: ${TOUR_API_KEY}
  odii:
    base-url: https://apis.data.go.kr/B551011/Odii
    service-key: ${ODII_SERVICE_KEY}
    mobile-os: AND
    mobile-app: Chaerok
    language-code: ko

oauth:
  kakao:
    client-id: ${KAKAO_NATIVE_APP_KEY}
    admin-key: ${KAKAO_ADMIN_KEY}
    issuer: https://kauth.kakao.com
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    issuer: https://accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

  apple:
    client-id: ${APPLE_CLIENT_ID}
    issuer: https://appleid.apple.com
    jwk-set-uri: https://appleid.apple.com/auth/keys

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  signup-expiration: ${JWT_SIGNUP_EXPIRATION}

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

aws:
  sqs:
    render-result-queue-url: ${RENDER_RESULT_QUEUE_URL:}
    render-result-consumer-enabled: ${RENDER_RESULT_CONSUMER_ENABLED:false}
    render-result-max-messages: ${RENDER_RESULT_MAX_MESSAGES:10}
    render-result-wait-time-seconds: ${RENDER_RESULT_WAIT_TIME_SECONDS:20}
    render-result-visibility-timeout-seconds: ${RENDER_RESULT_VISIBILITY_TIMEOUT_SECONDS:60}
    render-result-poll-delay-ms: ${RENDER_RESULT_POLL_DELAY_MS:1000}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

monitoring:
  username: ${ACTUATOR_USERNAME}
  password: ${ACTUATOR_PASSWORD}
